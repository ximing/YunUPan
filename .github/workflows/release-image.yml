name: Build image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t upan:latest .

      - name: Save image
        run: docker save upan:latest | gzip -1 > upan-image.tar.gz

      - name: Publish image to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-${GITHUB_SHA::12}"
          gh release create "$tag" upan-image.tar.gz \
            --target "$GITHUB_SHA" \
            --title "upan image ${GITHUB_SHA::12}" \
            --notes "Docker image \`upan:latest\`. Load with \`docker load -i upan-image.tar.gz\`."
