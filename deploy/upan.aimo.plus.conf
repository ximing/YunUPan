# Entry nginx on 39.96.159.212:
#   /root/apps/nginx/sites/aimo.plus/upan.conf
# Reload: docker exec openresty nginx -t && docker exec openresty nginx -s reload

server {
    listen 443 ssl;
    server_name upan.aimo.plus;
    charset utf-8;

    ssl_certificate     /root/apps/nginx/ssl/aimo.plus.cer;
    ssl_certificate_key /root/apps/nginx/ssl/aimo.plus.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 30m;

    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://222.128.65.91:13016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
